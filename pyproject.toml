[project]
name = "xai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "or.evan", email = "evanoreilly0801@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "captum>=0.9.0",
    "dice-ml>=0.12",
    "ipykernel>=7.4.0",
    "lime>=0.2.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
xai = "xai:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
